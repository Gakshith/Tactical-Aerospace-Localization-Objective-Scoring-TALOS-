name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      YOLO_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: env/requirements-cpu.txt
      - name: Install
        run: |
          pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r env/requirements-cpu.txt
          bash env/patch_trackeval.sh "$pythonLocation"
      - name: README tables match results/
        run: python scripts/readme_tables.py --check
      - name: Tests
        run: python -m pytest tests -q

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: talos:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tests inside the image
        run: docker run --rm talos:ci
      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          img=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/talos
          docker tag talos:ci "$img:latest"
          docker tag talos:ci "$img:${GITHUB_SHA::7}"
          docker push "$img:latest"
          docker push "$img:${GITHUB_SHA::7}"
